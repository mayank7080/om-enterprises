name: Clean catalog display
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update catalog
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('9194180624','919194180624')
          s=re.sub(r'<div class="product-bottom">\s*<strong>.*?</strong>\s*<a', '<div class="product-bottom"><a', s, flags=re.S)
          s=re.sub(r'<p class="catalog-note">.*?</p>','',s,flags=re.S)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Remove product prices and update contact number'
          git push
      - name: Remove workflow
        if: always()
        run: |
          rm -f .github/workflows/catalog-cleanup.yml
          git add -A
          git diff --cached --quiet || git commit -m 'Remove one-time catalog cleanup workflow'
          git push
